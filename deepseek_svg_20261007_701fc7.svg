<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E4A3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B89B5E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- الأيقونة الدائرية -->
  <rect x="300" y="15" width="85" height="85" rx="20" fill="url(#logoGrad)"/>
  
  <!-- رمز الشجرة داخل الدائرة (بديل حرف ن) -->
  <g transform="translate(342, 57)" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
    <!-- الجذع -->
    <line x1="0" y1="15" x2="0" y2="-5" />
    <!-- الفروع -->
    <path d="M0,-5 Q-12,-15 -18,-25" />
    <path d="M0,-5 Q12,-15 18,-25" />
    <path d="M0,-5 Q-6,-18 -8,-28" />
    <path d="M0,-5 Q6,-18 8,-28" />
    <!-- الجذور -->
    <path d="M0,15 Q-10,20 -15,18" />
    <path d="M0,15 Q10,20 15,18" />
  </g>
  
  <!-- النص الرئيسي -->
  <text x="280" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2E4A3A" text-anchor="end" direction="rtl">
    شجرة عائلة آل ندى
  </text>
  
  <!-- النص الفرعي -->
  <text x="280" y="85" font-family="Arial, sans-serif" font-size="12" fill="#6B7B6E" text-anchor="end" direction="rtl">
    توثيق شامل ومفصل لفروع ونسب العائلة الكريمة
  </text>
</svg>