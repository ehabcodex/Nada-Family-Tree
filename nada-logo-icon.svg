<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="شعار شجرة عائلة آل ندى">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F5A43"/>
      <stop offset="0.55" stop-color="#3E6B45"/>
      <stop offset="1" stop-color="#A38336"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D58B"/>
      <stop offset="1" stop-color="#D2A24A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- الخلفية -->
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect width="120" height="120" rx="28" fill="url(#glow)"/>

  <!-- فروع الشجرة -->
  <g fill="none" stroke="#FAF6EE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- الجذع -->
    <path d="M60 99 V40"/>
    <!-- الفرع الأعلى -->
    <path d="M60 68 C48 66 40 62 35 53"/>
    <path d="M60 68 C72 66 80 62 85 53"/>
    <!-- الفرع الأسفل -->
    <path d="M60 88 C48 87 40 84 34 77"/>
    <path d="M60 88 C72 87 80 84 86 77"/>
  </g>

  <!-- الجذور / الأرض -->
  <path d="M42 100 Q60 95 78 100" fill="none" stroke="#F3D58B" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>

  <!-- العقد: أفراد العائلة -->
  <circle cx="60" cy="28" r="9.5" fill="url(#gold)"/>
  <circle cx="35" cy="51" r="6.8" fill="#FAF6EE"/>
  <circle cx="85" cy="51" r="6.8" fill="#FAF6EE"/>
  <circle cx="34" cy="75" r="5.6" fill="#FAF6EE" opacity="0.92"/>
  <circle cx="86" cy="75" r="5.6" fill="#FAF6EE" opacity="0.92"/>
</svg>
